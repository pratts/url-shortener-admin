name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8086/api/v1
      VITE_SHORT_URL_HOST: localhost:8085
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/api.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
